name: meeting-booking-room

services:
  postgres:
    image: postgres:17-alpine
    container_name: mrb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_POST:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    container_name: mrb-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT}/${POSTGRES_DB}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET:-screte-test}
      SPRING_FLYWAY_LOCATIONS: classpath:db/migrate,classpath:db/seed
    ports:
      - "${APP_PORT:-8000}:8080"
    restart: unless-stopped
volumes:
  pgdata: